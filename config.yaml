telegram:
  token: "YOUR_BOT_TOKEN"
  webhook_url: "https://your.domain/webhook"
  webhook_path: "/webhook"
  webhook_port: 8080
  webhook_address: "0.0.0.0"
  webhook_secret: "YOUR_WEBHOOK_SECRET"

database:
  driver: "mysql+pymysql"
  host: "localhost"
  port: 3306
  user: "power_herald"
  password: "power_herald"
  database: "power_herald"

admin:
  chat_ids: ["YOUR_ADMIN_CHAT_ID_1", "YOUR_ADMIN_CHAT_ID_2"]

probing:
  passive:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 1
    probe_count: 3
  active:
    enabled: true
    port: 8081
    endpoint: "/active_ping"

outages:
  json_url: "https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/outages.json"
  daily_post_time: "07:00"
  daily_post_enabled: true

maintenance:
  default_enabled: false
  comment: "Scheduled maintenance"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

buildings:
  - id: "building_001"
    name: "Building A"
    chat_id: "123456789"
  - id: "building_002"
    name: "Building B"
    chat_id: "987654321"
