[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-herald"
version = "0.1.0"
description = "Telegram bot for power outage notifications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30,<4",
    "aiohttp>=3.14",
    "requests>=2.32",
    "ping3>=4.0",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mariadb = [
    "PyMySQL>=1.1",
]

[project.scripts]
ph-cli = "power_herald.cli:main"
ph-server = "power_herald.server:run"

[tool.setuptools.packages.find]
include = ["power_herald*"]
